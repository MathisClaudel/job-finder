# ═══════════════════════════════════════════════════════════════════
#  PROFIL — gabarit
#
#  Copier ce fichier en `profil/profil.yaml` et le remplir.
#  `profil/profil.yaml` est ignore par git : aucune donnee personnelle
#  ne part dans le depot.
#
#  Ce fichier est la source de verite unique : il alimente l'autofill
#  ATS, la generation de lettres et le scoring des offres.
# ═══════════════════════════════════════════════════════════════════

identite:
  prenom: Prenom
  nom: Nom
  email_perso: prenom.nom@example.com
  telephone: "+33 6 00 00 00 00"             # format international
  linkedin: www.linkedin.com/in/identifiant
  github: ""
  portfolio: ""
  adresse_actuelle: "1 rue Exemple, 00000 Ville, France"
  deja_installe_ville_cible: true            # argument fort : pas de relocalisation a negocier
  permis_b: false
  vehicule: false
  transports: "Moyen d'acces au bassin d'emploi vise"
  nationalite: Francaise
  autorisation_travail_ue: true

