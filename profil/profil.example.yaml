  type_contrat: [CDI]
  intitules_vises:
    - Ingenieur IA
    - AI Engineer
    - Developpeur .NET / C#
    - Data engineer
  localisation:
    presentiel:
      ville_cible: Ville                     # utilisee telle quelle par Adzuna et l'affichage
      code_insee: "00000"                    # requis par l'API France Travail pour le rayon geographique
      departement: "00"
      rayon_km: 40
      # Communes reconnues comme "sur zone" lors du scoring d'une offre.
      # Les accents sont facultatifs : les deux formes sont generees.
      villes_incluses: [Ville, Commune-voisine, Autre-commune]
    remote:
      accepte_full_remote: true
      zone: "Monde entier"
      fuseaux_acceptes: "UTC-3 a UTC+3"
